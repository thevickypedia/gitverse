name: update-release-notes

on:
  workflow_dispatch:
    inputs:
      project_version:
        type: string
        description: Version of the project to update release notes for
        required: true
  release:
    types: [ published ]

jobs:
  release-notes:
    runs-on:
      - thevickypedia-default
      - posix
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version
        run: echo "PROJECT_VERSION=${{ github.event.inputs.project_version || github.event.release.tag_name }}" >> $GITHUB_ENV
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
        shell: bash

      - name: Update Release Notes
        uses: thevickypedia/update-release-notes@v2
        with:
          git_token: ${{ secrets.GIT_TOKEN }}
          commit_message: "Update release notes for ${{ env.PROJECT_VERSION }}"
          filename: release_notes.rst
